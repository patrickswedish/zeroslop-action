<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="190" viewBox="0 0 1200 190" role="img" aria-labelledby="closingTitle closingDesc">
  <title id="closingTitle">ZeroSlop Sovereign Closing Hallmark — Surgical Invariants · Zero Regressions</title>
  <desc id="closingDesc">Executive closing hallmark banner for ZeroSlop by Ribbsaeter Systems with precision-engineered alignment and kinetic signal conduits.</desc>
  <defs>
    <style>
      .flow-a { stroke-dasharray: 8 16; animation: flowA 6.5s linear infinite; }
      .flow-b { stroke-dasharray: 5 18; animation: flowB 9s linear infinite reverse; }
      .pulse-node { animation: pNode 2.6s ease-in-out infinite; }
      .pulse-node-alt { animation: pNode 2.6s ease-in-out 1.3s infinite; }
      .core-glow { animation: cGlow 4s ease-in-out infinite; }
      .sweep-light { animation: sLight 8.5s ease-in-out infinite; }

      @keyframes flowA { to { stroke-dashoffset: -96; } }
      @keyframes flowB { to { stroke-dashoffset: -92; } }
      @keyframes pNode { 0%, 100% { opacity: 0.35; } 50% { opacity: 1; } }
      @keyframes cGlow { 0%, 100% { opacity: 0.92; } 50% { opacity: 1; } }
      @keyframes sLight {
        0%, 14% { transform: translateX(-280px); opacity: 0; }
        26% { opacity: 0.12; }
        66% { opacity: 0.05; }
        80%, 100% { transform: translateX(1380px); opacity: 0; }
      }

      @media (prefers-reduced-motion: reduce) {
        .flow-a, .flow-b, .pulse-node, .pulse-node-alt, .core-glow, .sweep-light { animation: none; }
      }
    </style>

    <linearGradient id="cBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050505"/>
      <stop offset="0.52" stop-color="#09090D"/>
      <stop offset="1" stop-color="#110C10"/>
    </linearGradient>

    <linearGradient id="sigGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FF5C4D"/>
      <stop offset="0.48" stop-color="#E33126"/>
      <stop offset="1" stop-color="#B81D13"/>
    </linearGradient>

    <linearGradient id="goldGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFE066"/>
      <stop offset="0.5" stop-color="#FFB800"/>
      <stop offset="1" stop-color="#FFA000"/>
    </linearGradient>

    <radialGradient id="haloCenter">
      <stop offset="0" stop-color="#E33126" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#050505" stop-opacity="0"/>
    </radialGradient>

    <pattern id="cGrid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#E33126" stroke-opacity="0.04"/>
    </pattern>

    <filter id="crispGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <clipPath id="cFrame">
      <rect width="1200" height="190" rx="20"/>
    </clipPath>
  </defs>

  <g clip-path="url(#cFrame)">
    <rect width="1200" height="190" fill="url(#cBg)"/>
    <rect width="1200" height="190" fill="url(#cGrid)"/>
    <ellipse cx="600" cy="95" rx="380" ry="160" fill="url(#haloCenter)"/>
    <path class="sweep-light" d="M -220 0 L -110 0 L 70 190 L -40 190 Z" fill="#FF8275" opacity="0"/>

    <!-- Left & Right Invariant Signal Conduits (Connecting to card at X=260 and X=940) -->
    <g fill="none" stroke="url(#sigGrad)">
      <path class="flow-a" d="M 0 52 L 140 52 L 195 95 L 260 95" stroke-width="1.5" opacity="0.65"/>
      <path class="flow-b" d="M 0 138 L 140 138 L 195 95 L 260 95" stroke-width="1.2" opacity="0.5"/>
      <path class="flow-b" d="M 1200 52 L 1060 52 L 1005 95 L 940 95" stroke-width="1.2" opacity="0.5"/>
      <path class="flow-a" d="M 1200 138 L 1060 138 L 1005 95 L 940 95" stroke-width="1.5" opacity="0.65"/>
    </g>

    <!-- Signal Nodes -->
    <g fill="#FF5C4D">
      <circle class="pulse-node" cx="140" cy="52" r="3.5"/>
      <circle class="pulse-node-alt" cx="140" cy="138" r="3.5"/>
      <circle class="pulse-node-alt" cx="1060" cy="52" r="3.5"/>
      <circle class="pulse-node" cx="1060" cy="138" r="3.5"/>
    </g>

    <!-- Sovereign Center Hallmark Card (680px wide × 110px high) -->
    <g class="core-glow">
      <!-- Card Body with Specular Gradient Border -->
      <rect x="260" y="40" width="680" height="110" rx="18" fill="#0E0A0C" stroke="url(#sigGrad)" stroke-opacity="0.85" stroke-width="1.4"/>
      <rect x="261" y="41" width="678" height="108" rx="17" fill="none" stroke="#E33126" stroke-opacity="0.15" stroke-width="1"/>

      <!-- Top Kicker (Sovereign Authority Tag) -->
      <text x="600" y="69" fill="#FF8275" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10.5" font-weight="700" letter-spacing="3.8" text-anchor="middle">
        RIBBSAETER SYSTEMS  ·  SOVEREIGN PRE-FLIGHT GUARANTEE
      </text>

      <!-- Center Hairline Divider with Centered Gold Diamond -->
      <line x1="360" y1="83" x2="840" y2="83" stroke="#E33126" stroke-opacity="0.25" stroke-width="1"/>
      <polygon points="600,79.5 603.5,83 600,86.5 596.5,83" fill="url(#goldGrad)"/>

      <!-- Headline (Bold, Warm Cream, Beautifully Centered) -->
      <text x="600" y="119" fill="#F4F0E8" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="24" font-weight="900" letter-spacing="2" text-anchor="middle" filter="url(#crispGlow)">
        SURGICAL INVARIANTS · ZERO REGRESSIONS
      </text>
    </g>

    <!-- Outer Perimeter Highlight Line -->
    <rect x="1" y="1" width="1198" height="188" rx="19" fill="none" stroke="#E33126" stroke-opacity="0.25" stroke-width="1.2"/>
  </g>
</svg>
