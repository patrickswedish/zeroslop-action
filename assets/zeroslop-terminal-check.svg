<svg xmlns="http://www.w3.org/2000/svg" width="840" height="300" viewBox="0 0 840 300" role="img" aria-labelledby="term-title term-desc">
  <title id="term-title">ZeroSlop™ Pre-Flight Terminal Execution</title>
  <desc id="term-desc">Simulation of ZeroSlop executing in GitHub Actions runner, intercepting bloat, blocking test deletions, and passing with Exit 0 Green.</desc>
  <defs>
    <linearGradient id="term-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050811"/>
      <stop offset="0.6" stop-color="#080F1E"/>
      <stop offset="1" stop-color="#0D172B"/>
    </linearGradient>
    <linearGradient id="term-border" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#E33126" stop-opacity=".6"/>
      <stop offset=".5" stop-color="#5FE7FF" stop-opacity=".7"/>
      <stop offset="1" stop-color="#10B981" stop-opacity=".7"/>
    </linearGradient>
    <filter id="glow-cyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow-green" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Terminal Window Background -->
  <rect x=".75" y=".75" width="838.5" height="298.5" rx="14" fill="url(#term-bg)" stroke="url(#term-border)" stroke-width="1.5"/>

  <!-- Window Header Bar -->
  <path d="M 1 14 C 1 6.8 6.8 1 14 1 H 826 C 833.2 1 839 6.8 839 14 V 34 H 1 Z" fill="#0C1526"/>
  <line x1="1" y1="34" x2="839" y2="34" stroke="#162540" stroke-width="1"/>

  <!-- macOS Window Controls -->
  <circle cx="22" cy="18" r="5.5" fill="#FF5F56"/>
  <circle cx="38" cy="18" r="5.5" fill="#FFBD2E"/>
  <circle cx="54" cy="18" r="5.5" fill="#27C93F"/>

  <!-- Header Title -->
  <text x="420" y="22" text-anchor="middle" fill="#75DDF0" font-family="'Inter',-apple-system,sans-serif" font-size="10.5" font-weight="700" letter-spacing=".8">
    RUNNER: ubuntu-latest · patrickswedish/zeroslop-action@v1 · EXIT 0
  </text>

  <!-- Terminal Console Text -->
  <g transform="translate(24, 62)" font-family="Consolas,'SF Mono','Fira Code',monospace" font-size="11.5" letter-spacing=".2">
    <!-- Command Invocation -->
    <text x="0" y="0">
      <tspan fill="#5FE7FF" font-weight="700">$</tspan>
      <tspan fill="#F4F9FF" font-weight="700"> zeroslop</tspan>
      <tspan fill="#9BB0C7"> --verify --mode=community --branch=main</tspan>
    </text>

    <!-- Execution Lines -->
    <text x="0" y="24">
      <tspan fill="#75DDF0">[AIRLOCK]</tspan>
      <tspan fill="#E1ECF7"> Ingested PR #42 diff stream · 424 added, 2 deleted lines across 6 files</tspan>
    </text>

    <text x="0" y="48">
      <tspan fill="#75DDF0">[AST]</tspan>
      <tspan fill="#E1ECF7"> Tokenizing AST syntax trees · Ephemeral Node 20 RAM enclave active</tspan>
    </text>

    <text x="0" y="72">
      <tspan fill="#FF6E63" font-weight="700">[INTERCEPT]</tspan>
      <tspan fill="#FFA399"> BLOCKED unauthorized test deletion: </tspan>
      <tspan fill="#FFD2CC">tests/test_invariants.py:84 (-18 lines)</tspan>
    </text>

    <text x="0" y="96">
      <tspan fill="#FF6E63" font-weight="700">[INTERCEPT]</tspan>
      <tspan fill="#FFA399"> Stripped 396 lines of defensive AI adapter bloat </tspan>
      <tspan fill="#5FE7FF" font-weight="700">(-93.4% diff reduction)</tspan>
    </text>

    <text x="0" y="120">
      <tspan fill="#34D399" font-weight="700">[INVARIANT]</tspan>
      <tspan fill="#D1FAE5"> Verified root contract preservation: </tspan>
      <tspan fill="#6EE7B7" font-weight="700">InpaintProcessor 3-tuple return (PASSED)</tspan>
    </text>

    <text x="0" y="144">
      <tspan fill="#34D399" font-weight="700">[POLISH]</tspan>
      <tspan fill="#E1ECF7"> Executed repo-native linter · Clean formatting committed to branch</tspan>
    </text>

    <text x="0" y="172">
      <tspan fill="#10B981" font-weight="700" filter="url(#glow-green)">✓</tspan>
      <tspan fill="#F4F9FF" font-weight="700"> GATEKEEPER PASS: </tspan>
      <tspan fill="#34D399" font-weight="700">All invariants verified in 1.4s · Zero regressions · Exit 0 (Green)</tspan>
    </text>

    <!-- Bottom Status Line -->
    <rect x="-4" y="196" width="796" height="22" rx="4" fill="#0A1E18" stroke="#10B981" stroke-opacity=".3"/>
    <text x="8" y="211" fill="#34D399" font-size="10" font-weight="700">
      ● 0.00% DRIFT TOLERANCE · ZERO CODE RETENTION · NIS2 COMPLIANT ENCLAVE
    </text>
  </g>
</svg>
