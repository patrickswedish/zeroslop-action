<svg xmlns="http://www.w3.org/2000/svg" width="210" height="42" viewBox="0 0 210 42" role="img" aria-labelledby="title desc">
  <title id="title">View Upstream Wall of Proof</title>
  <desc id="desc">Browse 16 verified merged upstream pull requests across Hugging Face, Meta, DuckDB, etc.</desc>
  <defs>
    <linearGradient id="btnBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0E223D"/>
      <stop offset="1" stop-color="#081424"/>
    </linearGradient>
    <linearGradient id="purpleAccent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#818CF8"/>
      <stop offset="1" stop-color="#A78BFA"/>
    </linearGradient>
  </defs>
  <rect x="0.5" y="0.5" width="209" height="41" rx="10" fill="url(#btnBg)" stroke="#A78BFA" stroke-opacity="0.34"/>
  <rect width="4" height="42" rx="2" fill="url(#purpleAccent)"/>
  
  <!-- Verified Badge Icon -->
  <g transform="translate(16 11)" fill="none" stroke="#A78BFA" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 10 2 L 12.5 5.5 L 17 6.5 L 16 11 L 18 15 L 14 17 L 12 21 L 8.5 19 L 5 21 L 4.5 16.5 L 1 14.5 L 3 10.5 L 1.5 6 L 6 5.5 Z"/>
    <path d="M 7.5 11 L 9.5 13 L 13 8.5"/>
  </g>
  
  <text x="48" y="17" fill="#C4B5FD" font-family="Inter,Arial,sans-serif" font-size="8" font-weight="700" letter-spacing="1.2">16 VERIFIED MERGES</text>
  <text x="48" y="30" fill="#F4F9FF" font-family="Inter,Arial,sans-serif" font-size="11.5" font-weight="800" letter-spacing="0.4">WALL OF PROOF</text>
  <text x="190" y="27" text-anchor="middle" fill="#A78BFA" font-family="Arial,sans-serif" font-size="14" font-weight="700">↓</text>
</svg>
